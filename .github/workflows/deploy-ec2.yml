name: Deploy to EC2 (docker-compose)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "Caddyfile"
      - ".github/workflows/deploy-ec2.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start ssh-agent with EC2 key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Trust EC2 host key
        run: ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Sync code to EC2
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -az --delete --exclude=".git/" --exclude="docs/" --exclude="frontend/"
          path: .
          remote_path: /home/${{ secrets.EC2_USER }}/Healthcare-Cost-Navigator
          remote_host: ${{ secrets.EC2_HOST }}
          remote_user: ${{ secrets.EC2_USER }}

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          script: |
            set -e
            cd ~/Healthcare-Cost-Navigator/backend
            if [ ! -f .env.prod ]; then
              echo ".env.prod missing on EC2; aborting to avoid overwriting"
              exit 1
            fi
            # Ensure postgres uses db.Dockerfile in docker-compose.prod.yml
            docker-compose --env-file .env.prod -f docker-compose.prod.yml build --no-cache postgres
            docker-compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
            docker ps
